id: file-writer
name: File Writer
version: 1.0.0
description: Write text into the run artifact directory.
category: demo
tags: [file, output]
inputs:
  text: {type: string, required: true}
  filename: {type: string, required: true}
outputs:
  file_path: {type: string, required: true}
executor: {type: python, entry: handler.py}
permissions: [filesystem_write]
timeout_seconds: 5
