[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowhub"
version = "0.1.0"
description = "Skill registry and deterministic DAG workflow skeleton"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
